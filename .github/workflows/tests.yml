# Unit tests for bin/ scripts, run inside the published analysis image.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: [analysis-container]
    types: [completed]
jobs:
  pytest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/manuelgug/16s-function-inference-analysis:0.3.0
      options: --user root   # image default user is non-root; Actions needs root in job containers
    steps:
      - uses: actions/checkout@v4
      - run: pytest -q -p no:cacheprovider
