# Builds the Python analysis image and publishes it to GHCR.
# Tag = containers/analysis/VERSION; bump it whenever environment.yml changes (conf/base.config pins it).
name: analysis-container
on:
  push:
    branches: [main]
    paths: ['containers/analysis/**', '.github/workflows/container.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat containers/analysis/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: containers/analysis
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}-analysis:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}-analysis:sha-${{ github.sha }}
